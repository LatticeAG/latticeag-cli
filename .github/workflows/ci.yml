name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.19", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm -r test
      - name: Codegen check
        run: pnpm --filter @latticeag/events codegen --check
      - name: Python events
        working-directory: packages/events/python
        run: |
          pip install pydantic pytest
          pytest tests
