[project]
name = "latticeag-events"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["latticeag_events"]

[tool.pytest.ini_options]
pythonpath = ["."]
